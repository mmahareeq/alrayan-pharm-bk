<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حلّل بشرتك مع صيدلية الريان</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #fbf9f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
            padding-bottom: 50px;
        }
        .navbar-brand {
            font-weight: bold;
            color: #d35400 !important;
        }
        .hero-section {
            padding: 40px 0 20px 0;
            text-align: center;
        }
        .hero-title {
            color: #c0392b;
            font-weight: 800;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .main-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            padding: 30px;
            margin-top: 20px;
        }
        .btn-primary {
            background-color: #0d6efd;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .table-responsive {
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body>

<!-- شريط التنقل العلوي -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="#">صيدلية الريان</a>
        <div class="ms-auto text-muted small">سوبر فارم & صيدلية الريان</div>
    </div>
</nav>

<div class="container">
    <div class="hero-section">
        <span class="badge bg-light text-danger border mb-2 px-3 py-2 rounded-pill">عناية أذكى ببشرتك +</span>
        <h1 class="hero-title">حلّل بشرتك مع صيدلية الريان</h1>
        <p class="text-muted">ارفعي صورة واضحة لبشرتك أو التقطيها مباشرة، واكتبي تفاصيل المشكلة للحصول على تحليل نوع البشرة وروتين عناية مخصص.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="card main-card">
                <form id="consultForm" enctype="multipart/form-data">
                    <div class="mb-4">
                        <label for="file" class="form-label fw-bold">ارفعي صورة لبشرتك (إجباري):</label>
                        <input class="form-control form-control-lg" type="file" id="file" name="file" accept="image/*" required>
                    </div>

                    <div class="mb-4">
                        <label for="symptom" class="form-label fw-bold">اشرحي مشكلتك بالتفصيل:</label>
                        <textarea class="form-control" id="symptom" name="symptom" rows="4" placeholder="مثال: بشرتي دهنية وأعاني من حب الشباب والآثار..." required></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                        <span id="btnText">بدء التحليل واقتراح الروتين</span>
                        <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                    </button>
                </form>

                <!-- منطقة النتائج -->
                <div id="resultsContainer" class="mt-5 d-none">
                    <hr class="my-4">
                    <h3 class="text-success mb-4 fw-bold">نتيجة التحليل والروتين المقترح:</h3>
                    
                    <div id="skinTypeBox" class="alert alert-info fw-bold fs-5"></div>
                    <div id="routineAdviceBox" class="alert alert-light border p-4 mb-4 fs-6"></div>
                    
                    <h4 class="fw-bold mb-3">المنتجات الموصى بها من المخزون:</h4>
                    <div id="productsList"></div>

                    <div id="warningBox" class="alert alert-warning mt-3 d-none"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('consultForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const resultsContainer = document.getElementById('resultsContainer');
    
    submitBtn.disabled = true;
    btnText.textContent = 'جاري تحليل الصورة والمنتجات...';
    btnSpinner.classList.remove('d-none');
    resultsContainer.classList.add('d-none');

    const formData = new FormData(this);

    try {
        const response = await fetch('/consult', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || 'حدث خطأ أثناء معالجة الطلب');
        }

        const res = data.result;
        const productsMap = data.products;

        document.getElementById('skinTypeBox').textContent = 'نوع البشرة المحدد: ' + res.skin_type;
        document.getElementById('routineAdviceBox').innerHTML = '<strong>الروتين اليومي:</strong><br>' + res.routine_advice.replace(/\n/g, '<br>');

        const productsList = document.getElementById('productsList');
        productsList.innerHTML = '';

        let tableHTML = `
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle bg-white">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>اسم الشركة</th>
                        <th>اسم الصنف</th>
                        <th>سبب الاختيار وطريقة الاستخدام</th>
                    </tr>
                </thead>
                <tbody>`;

        res.picks.forEach((item, index) => {
            const prod = productsMap[item.id] || {};
            const company = prod['اسم الشركة'] || prod['Company'] || '-';
            const name = prod['اسم الصنف'] || prod['Item Name'] || '-';

            tableHTML += `
                <tr>
                    <td><strong>${index + 1}</strong></td>
                    <td>${company}</td>
                    <td>${name}</td>
                    <td>${item.reason}</td>
                </tr>`;
        });

        tableHTML += `</tbody></table></div>`;
        productsList.innerHTML = tableHTML;

        if (res.warning) {
            const warningBox = document.getElementById('warningBox');
            warningBox.textContent = res.warning;
            warningBox.classList.remove('d-none');
        }

        resultsContainer.classList.remove('d-none');
        resultsContainer.scrollIntoView({ behavior: 'smooth' });

    } catch (err) {
        alert('خطأ: ' + err.message);
    } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'بدء التحليل واقتراح الروتين';
        btnSpinner.classList.add('d-none');
    }
});
</script>
</body>
</html>
