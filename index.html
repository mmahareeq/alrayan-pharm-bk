<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استشارة البشرة - صيدلية الريان وسوبر فارم</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0d6efd;
            --bg-color: #f8f9fa;
        }
        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 30px;
        }
        .main-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            background: #ffffff;
        }
        /* تحسين التجاوب للجداول على الموبايل */
        .table-responsive-custom {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 8px;
            margin-bottom: 1rem;
        }
        .table-responsive-custom table {
            min-width: 600px; /* ضمان عدم انكماش الجدول بشكل مشوه */
        }
        .product-img-preview {
            max-width: 100%;
            height: auto;
            max-height: 250px;
            object-fit: contain;
            border-radius: 12px;
        }
        /* تعديلات خفيفة للموبايل */
        @media (max-width: 576px) {
            .container {
                padding-left: 12px;
                padding-right: 12px;
            }
            .card-body {
                padding: 1.25rem;
            }
            h2 {
                font-size: 1.4rem;
            }
            .btn-lg {
                padding: 0.75rem 1rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div class="container my-3 my-md-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="card main-card p-2 p-md-4">
                <div class="card-body">
                    <h2 class="text-center text-primary mb-4 fw-bold">فحص البشرة بالذكاء الاصطناعي 🌿</h2>
                    <p class="text-center text-muted mb-4">صيدلية الريان & super Farm</p>

                    <form id="consultForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label for="symptom" class="form-label fw-bold">وصف المشكلة أو الشكوى:</label>
                            <textarea class="form-control" id="symptom" name="symptom" rows="3" placeholder="مثال: بشرتي دهنية وأعاني من حب الشباب والآثار..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label for="file" class="form-label fw-bold">ارفق صورة للبشرة:</label>
                            <input class="form-control" type="file" id="file" name="file" accept="image/*" capture="environment" required>
                            <div class="form-text">يمكنك التقاط صورة مباشرة على الهاتف أو اختيارها من المعرض.</div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg w-100 fw-bold">
                            <span id="btnText">بدء التحليل واقتراح الروتين</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                        </button>
                    </form>

                    <!-- منطقة عرض النتائج -->
                    <div id="resultsContainer" class="mt-4 d-none">
                        <hr class="my-4">
                        <h4 class="text-success mb-3 fw-bold">نتيجة التحليل والروتين المقترح:</h4>
                        
                        <div id="skinTypeBox" class="alert alert-info fw-bold"></div>
                        <div id="routineAdviceBox" class="alert alert-light border p-3 mb-3"></div>
                        
                        <h5 class="fw-bold mt-4 mb-3">المنتجات الموصى بها من المخزون:</h5>
                        <div id="productsList"></div>

                        <div id="warningBox" class="alert alert-warning mt-3 d-none"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('consultForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const resultsContainer = document.getElementById('resultsContainer');
    
    // إظهار حالة التحميل
    submitBtn.disabled = true;
    btnText.textContent = 'جاري تحليل الصورة والمنتجات...';
    btnSpinner.classList.remove('d-none');
    resultsContainer.classList.add('d-none');

    const formData = new FormData(this);

    try {
        const response = await fetch('/consult', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || 'حدث خطأ أثناء معالجة الطلب');
        }

        const res = data.result;
        const productsMap = data.products;

        // عرض نوع البشرة والنصائح
        document.getElementById('skinTypeBox').textContent = 'نوع البشرة المحدد: ' + res.skin_type;
        document.getElementById('routineAdviceBox').innerHTML = '<strong>الروتين اليومي:</strong><br>' + res.routine_advice.replace(/\n/g, '<br>');

        // عرض المنتجات في جدول تجاوبي للموبايل
        const productsList = document.getElementById('productsList');
        productsList.innerHTML = '';

        let tableHTML = `
        <div class="table-responsive-custom">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-primary">
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>اسم الشركة</th>
                        <th>اسم الصنف</th>
                        <th>سبب الاختيار وطريقة الاستخدام</th>
                    </tr>
                </thead>
                <tbody>`;

        res.picks.forEach((item, index) => {
            const prod = productsMap[item.id] || {};
            const company = prod['اسم الشركة'] || prod['Company'] || '-';
            const name = prod['اسم الصنف'] || prod['Item Name'] || '-';

            tableHTML += `
                <tr>
                    <td><strong>${index + 1}</strong></td>
                    <td>${company}</td>
                    <td>${name}</td>
                    <td>${item.reason}</td>
                </tr>`;
        });

        tableHTML += `</tbody></table></div>`;
        productsList.innerHTML = tableHTML;

        // عرض التنبيهات إن وجدت
        if (res.warning) {
            const warningBox = document.getElementById('warningBox');
            warningBox.textContent = res.warning;
            warningBox.classList.remove('d-none');
        }

        resultsContainer.classList.remove('d-none');
        
        // التمرير التلقائي للنتائج على الهاتف
        resultsContainer.scrollIntoView({ behavior: 'smooth' });

    } catch (err) {
        alert('خطأ: ' + err.message);
    } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'بدء التحليل واقتراح الروتين';
        btnSpinner.classList.add('d-none');
    }
});
</script>
</body>
</html>
